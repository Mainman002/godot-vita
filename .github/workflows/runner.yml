name: 🔗 GHA
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-runner
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  static-checks:
    name: 📊 Static
    uses: ./.github/workflows/static_checks.yml

  android-build:
    name: 🤖 Android
    needs: static-checks
    uses: ./.github/workflows/android_builds.yml

  ios-build:
    name: 🍏 iOS
    needs: static-checks
    uses: ./.github/workflows/ios_builds.yml

  javascript-build:
    name: 🌐 JavaScript
    needs: static-checks
    uses: ./.github/workflows/javascript_builds.yml

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    uses: ./.github/workflows/linux_builds.yml

  macos-build:
    name: 🍎 macOS
    needs: static-checks
    uses: ./.github/workflows/macos_builds.yml

  server-build:
    name: ☁ Server
    needs: static-checks
    uses: ./.github/workflows/server_builds.yml

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    uses: ./.github/workflows/windows_builds.yml

  vita-build:
    name: 🎮 PSVita
    needs: static-checks
    uses: ./.github/workflows/vita_builds.yml

  release:
    name: 🚀 Release and Package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android-build, ios-build, javascript-build, linux-build, macos-build, windows-build, vita-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # This specific download ensures the Vita files are in the right sub-folder
      - name: Download Vita artifact
        uses: actions/download-artifact@v4
        with:
          name: vita-template
          path: ./artifacts/vita-template

      - name: Structure macOS Editor App
        run: |
          mkdir -p Godot.app/Contents/MacOS

          # 1. Create the self-contained marker and the data folder
          touch Godot.app/Contents/MacOS/_sc_
          mkdir -p Godot.app/Contents/MacOS/editor_data

          # 2. Extract and copy binary
          cd ./artifacts/macos-editor
          unzip -o *.zip || true
          cd ../../
          cp ./artifacts/macos-editor/godot.osx* Godot.app/Contents/MacOS/Godot

          # 3. Explicitly set permissions BEFORE zipping
          chmod +x Godot.app/Contents/MacOS/Godot
          # Ensure every directory in the bundle has the 'executable' bit for traversal
          find Godot.app -type d -exec chmod 755 {} +
          # Ensure files are writable
          find Godot.app -type f -exec chmod 644 {} +
          chmod 755 Godot.app/Contents/MacOS/Godot

          # 4. Use 'zip -ry' to preserve symlinks and attributes
          zip -ry Godot_macOS_Editor.zip Godot.app

      - name: Package Godot Templates (.tpz)
        run: |
          echo "===== ARTIFACT TREE ====="
          find artifacts -maxdepth 3 -type f
          echo "========================="

          mkdir -p tpz_staging/templates

          # 1. Create the version.txt (Godot needs this to identify the template version)
          # Replace '3.7.dev' with your specific version if different
          echo "3.7.dev" > tpz_staging/templates/version.txt

          # 2. Vita (Special handling: must be a zip within the tpz)
          cd artifacts/vita-template
          unzip -o *.zip || true
          zip -r ../../tpz_staging/templates/vita_release.zip eboot.bin module sce_sys -x "*.DS_Store" -x "__MACOSX*" -x "._*"
          cd ../../

          # 3. Windows
          cp artifacts/windows-template-release/godot.windows.opt.64.exe tpz_staging/templates/windows_64_release.exe || true
          cp artifacts/windows-template-debug/godot.windows.opt.debug.64.exe tpz_staging/templates/windows_64_debug.exe || true

          # 4. Linux (Updated for Mono naming)
          if [ -f artifacts/linux-template-release-mono/godot.x11.opt.64.mono ]; then
            cp artifacts/linux-template-release-mono/godot.x11.opt.64.mono tpz_staging/templates/linux_x11_64_release
          fi
          if [ -f artifacts/linux-template-debug-mono/godot.x11.opt.debug.64.mono ]; then
            cp artifacts/linux-template-debug-mono/godot.x11.opt.debug.64.mono tpz_staging/templates/linux_x11_64_debug
          fi

          # 5. macOS Template (Direct copy instead of unzip)
          mkdir -p macos_template_staging
          # Copy binaries directly if they aren't zipped in the artifact
          cp artifacts/macos-template-release/godot.osx.opt.64 macos_template_staging/ || true
          cp artifacts/macos-template-debug/godot.osx.opt.debug.64 macos_template_staging/ || true

          if [ "$(ls -A macos_template_staging 2>/dev/null)" ]; then
            cd macos_template_staging
            zip -ry ../tpz_staging/templates/osx.zip . -x "*.DS_Store"
            cd ../
          fi

          # 6. Android Template Packaging
          # Release
          cp artifacts/android-template-release/android_release.apk tpz_staging/templates/android_release.apk || true

          # Debug
          cp artifacts/android-template-debug/android_debug.apk tpz_staging/templates/android_debug.apk || true

          # 7. iOS Template Packaging (Updated to handle raw .a files)
          mkdir -p ios_template_staging

          # Copy Release Library directly
          if [ -f artifacts/ios-template-release/libgodot.iphone.opt.arm64.a ]; then
            cp artifacts/ios-template-release/libgodot.iphone.opt.arm64.a ios_template_staging/
          fi

          # Copy Debug Library directly
          if [ -f artifacts/ios-template-debug/libgodot.iphone.opt.debug.arm64.a ]; then
            cp artifacts/ios-template-debug/libgodot.iphone.opt.debug.arm64.a ios_template_staging/
          fi

          # Re-zip into the final iphone.zip for the .tpz
          if [ "$(ls -A ios_template_staging 2>/dev/null)" ]; then
            cd ios_template_staging
            zip -ry ../tpz_staging/templates/iphone.zip . -x "*.DS_Store"
            cd ../
          fi

          # 8. JavaScript (Web) Template Packaging
          # Release
          cp artifacts/javascript-template-release/*.zip tpz_staging/templates/webassembly_release.zip || true

          # 9. Server Template Packaging
          # Release
          cp artifacts/server-template-release-mono/godot_server.x11.opt.64.mono tpz_staging/templates/linux_server_64_release || true

          # Debug
          cp artifacts/server-template-debug-mono/godot_server.x11.opt.debug.64.mono tpz_staging/templates/linux_server_64_debug || true

          # 10. Create the final TPZ
          cd tpz_staging
          zip -r ../godot-vita-templates.tpz templates/ -x "*.DS_Store" -x "__MACOSX*" -x "._*"
          cd ../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            godot-vita-templates.tpz
            Godot_macOS_Editor.zip
            ./artifacts/windows-editor/godot.windows.opt.tools.64.exe
            ./artifacts/linux-editor-mono/godot.x11.opt.tools.64.mono
