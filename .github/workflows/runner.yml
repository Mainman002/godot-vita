name: 🔗 GHA
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-runner
  cancel-in-progress: true

jobs:
  static-checks:
    name: 📊 Static
    uses: ./.github/workflows/static_checks.yml

  android-build:
    name: 🤖 Android
    needs: static-checks
    uses: ./.github/workflows/android_builds.yml

  ios-build:
    name: 🍏 iOS
    needs: static-checks
    uses: ./.github/workflows/ios_builds.yml

  javascript-build:
    name: 🌐 JavaScript
    needs: static-checks
    uses: ./.github/workflows/javascript_builds.yml

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    uses: ./.github/workflows/linux_builds.yml

  macos-build:
    name: 🍎 macOS
    needs: static-checks
    uses: ./.github/workflows/macos_builds.yml

  server-build:
    name: ☁ Server
    needs: static-checks
    uses: ./.github/workflows/server_builds.yml

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    uses: ./.github/workflows/windows_builds.yml

  vita-build:
    name: 🎮 PSVita
    needs: static-checks
    uses: ./.github/workflows/vita_builds.yml

  release:
    name: 🚀 Release and Package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android-build, ios-build, javascript-build, linux-build, macos-build, windows-build, vita-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # This specific download ensures the Vita files are in the right sub-folder
      - name: Download Vita artifact
        uses: actions/download-artifact@v4
        with:
          name: vita-template
          path: ./artifacts/vita-template

      - name: Unzip All Editor Artifacts
        run: |
          for dir in ./artifacts/*/; do
            cd "$dir"
            unzip -o *.zip || true
            cd ../../
          done

      - name: Package Vita Templates
        run: |
          mkdir -p ./tpz_staging

          # 1. Enter the artifact directory
          cd ./artifacts/vita-template

          # 2. Unzip the actual artifact content if it's zipped (common in GHA v4)
          # If the file is just the binary, this will gracefully fail or skip
          unzip -o *.zip || true

          # 3. Go back and copy the binary using the wildcard
          cd ../../
          cp ./artifacts/vita-template/godot.vita* ./tpz_staging/vita_release.zip

          # 4. Create the TPZ
          cd ./tpz_staging
          zip -r ../godot-vita-templates.tpz .
          mv ../godot-vita-templates.tpz ..

      - name: Structure macOS Editor App
        run: |
          mkdir -p Godot.app/Contents/MacOS
          cd ./artifacts/macos-editor
          unzip -o *.zip || true
          cd ../../
          # Using wildcard to handle the binary name
          cp ./artifacts/macos-editor/godot.osx* Godot.app/Contents/MacOS/Godot
          chmod +x Godot.app/Contents/MacOS/Godot
          zip -r Godot_macOS_Editor.zip Godot.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            godot-vita-templates.tpz
            Godot_macOS_Editor.zip
            ./artifacts/windows-editor/godot.windows*
            ./artifacts/linux-editor/godot.x11*
